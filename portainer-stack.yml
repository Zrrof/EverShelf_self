services:
  evershelf:
    # Pin the verified build so an older concurrent workflow cannot replace it.
    image: ghcr.io/zrrof/evershelf:sha-30e6b26
    platform: linux/arm64
    container_name: evershelf
    ports:
      - "8080:80"
    volumes:
      - evershelf_data:/var/www/html/data
    environment:
      TZ: Europe/Berlin
    restart: unless-stopped

volumes:
  evershelf_data:
    driver: local
